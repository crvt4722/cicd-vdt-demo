name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-flask

      - name: Lint with flake8
        run: flake8 app.py

      - name: Run tests
        run: pytest tests/ -v --tb=short

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-flask pytest-cov

      - name: Run tests with coverage
        id: pytest
        run: pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=70 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Post coverage comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('coverage-output.txt', 'utf8');
            const passed = '${{ steps.pytest.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'Passed (≥ 70%)' : 'Failed (< 70%)';
            const body = [
              `## ${icon} Code Coverage — ${status}`,
              '',
              '<details><summary>Coverage Report</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Enforce coverage threshold
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  security-trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Trivy HTML template
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl

      - name: Trivy - Dependency Vulnerability Scan
        id: trivy-vuln
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: trivy-vuln.json
        continue-on-error: true

      - name: Trivy - IaC Configuration Scan
        id: trivy-iac
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: trivy-iac.json
          skip-setup-trivy: "true"
        continue-on-error: true

      - name: Trivy - Secret Detection
        id: trivy-secret
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          format: json
          output: trivy-secret.json
          skip-setup-trivy: "true"
        continue-on-error: true

      - name: Generate HTML and table reports from JSON
        if: always()
        run: |
          TEMPLATE="@$GITHUB_WORKSPACE/html.tpl"
          for type in vuln iac secret; do
            json="trivy-${type}.json"
            if [ -f "$json" ]; then
              trivy convert --format template --template "$TEMPLATE" --output "trivy-${type}.html" "$json" 2>&1 || true
              trivy convert --format table "$json" 2>&1 | tee "trivy-${type}.txt" || true
            else
              echo "(scan did not produce output)" > "trivy-${type}.txt"
            fi
          done

      - name: Upload Trivy HTML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-reports
          path: |
            trivy-vuln.html
            trivy-iac.html
            trivy-secret.html

      - name: Post Trivy Security Comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const readFile = (path) => {
              try { return fs.readFileSync(path, 'utf8').trim() || '(no output)'; }
              catch { return '(no output)'; }
            };

            const vulnOut   = readFile('trivy-vuln.txt');
            const iacOut    = readFile('trivy-iac.txt');
            const secretOut = readFile('trivy-secret.txt');

            const vulnOk   = '${{ steps.trivy-vuln.outcome }}'   === 'success';
            const iacOk    = '${{ steps.trivy-iac.outcome }}'    === 'success';
            const secretOk = '${{ steps.trivy-secret.outcome }}' === 'success';

            const icon = (ok) => ok ? '✅' : '❌';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const body = [
              '## Trivy Security Scan',
              '',
              '| Scan Type | Status |',
              '|-----------|--------|',
              `| ${icon(vulnOk)} Dependency Vulnerabilities (HIGH/CRITICAL) | ${vulnOk ? 'No issues found' : 'Issues detected!'} |`,
              `| ${icon(iacOk)} IaC Configuration (HIGH/CRITICAL) | ${iacOk ? 'No issues found' : 'Issues detected!'} |`,
              `| ${icon(secretOk)} Secret Detection | ${secretOk ? 'No secrets found' : 'Secrets detected!'} |`,
              '',
              '<details><summary>📦 Dependency Vulnerability Scan</summary>',
              '',
              '```',
              vulnOut,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>🏗️ IaC Configuration Scan</summary>',
              '',
              '```',
              iacOut,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>🔑 Secret Detection</summary>',
              '',
              '```',
              secretOut,
              '```',
              '',
              '</details>',
              '',
              `> 📄 HTML reports: [Download from workflow artifacts](${runUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if security issues found
        if: |
          steps.trivy-vuln.outcome == 'failure' ||
          steps.trivy-iac.outcome == 'failure' ||
          steps.trivy-secret.outcome == 'failure'
        run: exit 1

  security-sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bandit
        run: pip install bandit

      - name: Run static security analysis
        id: bandit
        run: bandit -r app.py -ll --skip B201,B104 2>&1 | tee bandit-output.txt
        continue-on-error: true

      - name: Post SAST comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('bandit-output.txt', 'utf8');
            const passed = '${{ steps.bandit.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'No issues found' : 'Security issues detected!';
            const body = [
              `## ${icon} SAST (Bandit) — ${status}`,
              '',
              '<details><summary>Analysis Output</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if issues found
        if: steps.bandit.outcome == 'failure'
        run: exit 1

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        id: docker
        run: docker build . 2>&1 | tee docker-output.txt
        continue-on-error: true

      - name: Post Docker build comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('docker-output.txt', 'utf8');
            const passed = '${{ steps.docker.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'Image built successfully' : 'Build failed!';
            const body = [
              `## ${icon} Docker Build Validation — ${status}`,
              '',
              '<details><summary>Build Output</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if build failed
        if: steps.docker.outcome == 'failure'
        run: exit 1
