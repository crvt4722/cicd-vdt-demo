name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-flask

      - name: Lint with flake8
        run: flake8 app.py

      - name: Run tests
        run: pytest tests/ -v --tb=short

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-flask pytest-cov

      - name: Run tests with coverage
        id: pytest
        run: pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=70 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Post coverage comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('coverage-output.txt', 'utf8');
            const passed = '${{ steps.pytest.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'Passed (≥ 70%)' : 'Failed (< 70%)';
            const body = [
              `## ${icon} Code Coverage — ${status}`,
              '',
              '<details><summary>Coverage Report</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Enforce coverage threshold
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  security-deps:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan dependencies for vulnerabilities
        id: audit
        run: pip-audit -r requirements.txt 2>&1 | tee audit-output.txt
        continue-on-error: true

      - name: Post audit comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit-output.txt', 'utf8');
            const passed = '${{ steps.audit.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'No vulnerabilities found' : 'Vulnerabilities detected!';
            const body = [
              `## ${icon} Dependency Security Scan — ${status}`,
              '',
              '<details><summary>Scan Output</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if vulnerabilities found
        if: steps.audit.outcome == 'failure'
        run: exit 1

  security-sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bandit
        run: pip install bandit

      - name: Run static security analysis
        id: bandit
        run: bandit -r app.py -ll --skip B201,B104 2>&1 | tee bandit-output.txt
        continue-on-error: true

      - name: Post SAST comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('bandit-output.txt', 'utf8');
            const passed = '${{ steps.bandit.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'No issues found' : 'Security issues detected!';
            const body = [
              `## ${icon} SAST (Bandit) — ${status}`,
              '',
              '<details><summary>Analysis Output</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if issues found
        if: steps.bandit.outcome == 'failure'
        run: exit 1

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        id: docker
        run: docker build . 2>&1 | tee docker-output.txt
        continue-on-error: true

      - name: Post Docker build comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('docker-output.txt', 'utf8');
            const passed = '${{ steps.docker.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'Image built successfully' : 'Build failed!';
            const body = [
              `## ${icon} Docker Build Validation — ${status}`,
              '',
              '<details><summary>Build Output</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if build failed
        if: steps.docker.outcome == 'failure'
        run: exit 1
