{% extends "base.html" %}
{% block title %}Thanh toán — TechShop{% endblock %}
{% block content %}
<h1 class="page-title">💳 Thanh toán</h1>

<div class="checkout-layout">
  <div class="checkout-form">
    <h3>Thông tin giao hàng</h3>
    <form action="{{ url_for('checkout') }}" method="post">
      <div class="form-group">
        <label>Họ và tên *</label>
        <input type="text" name="name" placeholder="Nguyễn Văn A" required>
      </div>
      <div class="form-group">
        <label>Số điện thoại *</label>
        <input type="tel" name="phone" placeholder="0912 345 678" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label>Địa chỉ giao hàng *</label>
        <textarea name="address" rows="3" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố" required></textarea>
      </div>
      <div class="form-group">
        <label>Phương thức thanh toán</label>
        <div class="payment-options">
          <label class="radio-option">
            <input type="radio" name="payment" value="cod" checked> 💵 Thanh toán khi nhận hàng (COD)
          </label>
          <label class="radio-option">
            <input type="radio" name="payment" value="bank"> 🏦 Chuyển khoản ngân hàng
          </label>
          <label class="radio-option">
            <input type="radio" name="payment" value="momo"> 📱 Ví MoMo
          </label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">✅ Đặt hàng</button>
    </form>
  </div>

  <div class="order-summary">
    <h3>Đơn hàng của bạn</h3>
    {% for item in items %}
    <div class="order-item">
      <span>{{ item.name }} × {{ item.qty }}</span>
      <span>{{ item.subtotal | vnd }}</span>
    </div>
    {% endfor %}
    <hr>
    <div class="order-total">
      <span>Tổng cộng</span>
      <span class="price">{{ total | vnd }}</span>
    </div>
  </div>
</div>
{% endblock %}
