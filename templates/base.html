<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TechShop{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="{{ url_for('index') }}" class="logo">⚡ TechShop</a>
      <form class="search-form" action="{{ url_for('index') }}" method="get">
        <input type="text" name="search" placeholder="Tìm sản phẩm..." value="{{ request.args.get('search', '') }}">
        <button type="submit">🔍</button>
      </form>
      <a href="{{ url_for('cart') }}" class="cart-btn">
        🛒 Giỏ hàng <span class="badge">{{ cart_count }}</span>
      </a>
    </div>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container">
      <p>© 2024 TechShop — Demo CI/CD VDT</p>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
